[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["core*", "apps*", "config*"]

[project]
name = "operaciones-citas-backend"
version = "0.1.0"
description = "Plataforma multitenant de citas y operaciones"
requires-python = ">=3.11"
dependencies = [
    # Django 5.2 es la rama LTS (soporte hasta 2028). 5.0 quedó EOL en abril de 2025
    # y arrastra CVEs sin parche, por eso el piso es 5.2.16 y no la 5.0 original.
    "django>=5.2.16,<5.3",
    "djangorestframework>=3.16,<3.17",
    # >=5.5.1 cierra PYSEC-2026-1305 (validación de tokens).
    "djangorestframework-simplejwt>=5.5.1,<5.6",
    "pyjwt>=2.13,<3.0",
    "sqlparse>=0.5.4",
    "psycopg[binary]>=3.2,<3.3",
    "celery>=5.5,<5.6",
    "redis>=5.2,<6.0",
    "django-redis>=5.4,<6.0",
    "django-cors-headers>=4.9,<5.0",
    "django-filter>=25.1,<26.0",
    "python-decouple>=3.8,<3.9",
    "drf-spectacular>=0.28,<0.29",
    "gunicorn>=23.0,<24.0",
]

[project.optional-dependencies]
dev = [
    # >=9.0.3 cierra PYSEC-2026-1845; pytest-django 4.14 es la primera compatible con pytest 9.
    "pytest>=9.0.3,<10",
    "pytest-django>=4.14,<5",
    "pytest-cov>=7.0,<8",
    "factory-boy>=3.3,<4",
    "ruff>=0.5,<0.6",
    "mypy>=1.10,<1.11",
    # django-stubs debe seguir la rama de Django (5.2 LTS).
    "django-stubs>=5.2,<5.3",
    "pre-commit>=3.7,<5",
    "freezegun>=1.5,<2",
]

[tool.ruff]
line-length = 110
target-version = "py312"
exclude = ["**/migrations/*.py", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]
ignore = ["DJ001"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
addopts = "--reuse-db"

[tool.mypy]
plugins = ["mypy_django_plugin.main"]
python_version = "3.12"
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings.test"

[tool.coverage.run]
source = ["core", "apps"]
omit = ["*/migrations/*", "*/tests/*", "*/tests.py"]
