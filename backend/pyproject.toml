[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["core*", "apps*", "config*"]

[project]
name = "operaciones-citas-backend"
version = "0.1.0"
description = "Plataforma multitenant de citas y operaciones"
requires-python = ">=3.11"
dependencies = [
    "django>=5.0,<5.1",
    "djangorestframework>=3.15,<3.16",
    "djangorestframework-simplejwt>=5.3,<5.4",
    "psycopg[binary]>=3.1,<3.2",
    "celery>=5.4,<5.5",
    "redis>=5.0,<5.1",
    "django-redis>=5.4,<5.5",
    "django-cors-headers>=4.4,<4.5",
    "django-filter>=24.2,<24.3",
    "python-decouple>=3.8,<3.9",
    "drf-spectacular>=0.27,<0.28",
    "gunicorn>=22.0,<23.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<8.3",
    "pytest-django>=4.8,<4.9",
    "pytest-cov>=5.0,<5.1",
    "factory-boy>=3.3,<3.4",
    "ruff>=0.5,<0.6",
    "mypy>=1.10,<1.11",
    "django-stubs>=5.0,<5.1",
    "pre-commit>=3.7,<3.8",
    "freezegun>=1.5,<1.6",
]

[tool.ruff]
line-length = 110
target-version = "py312"
exclude = ["**/migrations/*.py", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]
ignore = ["DJ001"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
addopts = "--reuse-db"

[tool.mypy]
plugins = ["mypy_django_plugin.main"]
python_version = "3.12"
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings.test"

[tool.coverage.run]
source = ["core", "apps"]
omit = ["*/migrations/*", "*/tests/*", "*/tests.py"]
