name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: operaciones_citas
          POSTGRES_PASSWORD: operaciones_citas
          POSTGRES_DB: operaciones_citas
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: operaciones_citas
      DB_USER: operaciones_citas
      DB_PASSWORD: operaciones_citas
      REDIS_URL: redis://localhost:6379/0
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - run: pip install -e .[dev]

      - run: ruff check .
      - run: ruff format --check .

      # mypy está configurado (pyproject.toml) pero no se agrega aquí todavía:
      # tiene errores de tipos reales acumulados en varios apps (payments,
      # modules, reports) que requieren su propia revisión antes de poder
      # bloquear el pipeline con él.
      - run: python manage.py migrate
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npx tsc -b
      - run: npm run test
      - run: npm run build
